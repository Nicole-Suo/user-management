<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Management</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f3f7ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1e293b;
      }
      .app-shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        background: #102a43;
        color: #f8fafc;
        padding: 22px 16px;
      }
      .sidebar h1 {
        margin: 0 0 18px;
        font-size: 28px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .nav a {
        display: block;
        padding: 10px 12px;
        border-radius: 10px;
        color: #e2e8f0;
        text-decoration: none;
        background: rgba(148, 163, 184, 0.12);
      }
      .nav a.active {
        background: rgba(96, 165, 250, 0.3);
      }
      .content {
        flex: 1;
        padding: 32px;
      }
      .panel {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
        padding: 24px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .header h2 {
        margin: 0;
      }
      .tag {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid #e2e8f0;
      }
      th {
        color: #475569;
        background: #f8fafc;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .metric {
        padding: 18px;
        border-radius: 14px;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
      }
      .metric .label {
        font-size: 13px;
        color: #475569;
      }
      .metric .value {
        margin-top: 8px;
        font-size: 30px;
        font-weight: 700;
      }
      .badge-list { display:flex; flex-wrap:wrap; gap:8px; }
      .badge { padding:6px 10px; border-radius:999px; background:#ecfeff; color:#0f766e; font-size:12px; }
      .login-wrapper {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
      }
      .login-card {
        width: min(420px, 90vw);
        background: #fff;
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }
      .login-card h2 { margin-top:0; }
      .login-card form { display:flex; flex-direction:column; gap:12px; }
      .login-card input, .login-card button {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 15px;
      }
      .login-card button {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .muted { color:#64748b; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      {# If this page is embedded in the SPA iframe (embed=1), don't render the backend sidebar #}
      {% if not request.args.get('embed') and user is defined and user.is_authenticated %}
        <aside class="sidebar">
          <h1>UserMgmt</h1>
          <div class="nav">
            <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">首页</a>
            <a href="/users" class="{% if request.path == '/users' %}active{% endif %}">用户管理</a>
            <a href="/roles" class="{% if request.path == '/roles' %}active{% endif %}">角色权限</a>
            <a href="/profile" class="{% if request.path == '/profile' %}active{% endif %}">个人资料</a>
          </div>
        </aside>
      {% endif %}
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
