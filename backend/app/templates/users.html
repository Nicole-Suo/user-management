{% extends 'base.html' %}

{% block content %}
<div class="panel">
  <div class="header">
    <h2>用户管理</h2>
    <span class="tag">{{ users|length }} users</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>邮箱</th>
        <th>姓名</th>
      </tr>
    </thead>
    <tbody>
      {% for row in users %}
      <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.username }}</td>
        <td>{{ row.email }}</td>
        <td>{{ row.full_name or '-' }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
